services:
  endpoint:
    image: r2dbc-dns-leak-repro:1.1.2
    entrypoint: ["java", "-Xmx32m", "-cp", "/repro/classes", "TcpEndpoint"]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/3333"]
      interval: 1s
      timeout: 2s
      retries: 20
  driver112:
    image: r2dbc-dns-leak-repro:1.1.2
    build:
      context: .
      args:
        DRIVER_VERSION: 1.1.2.RELEASE
    depends_on:
      endpoint:
        condition: service_healthy
    mem_limit: 256m
    cpus: 1.0
  driver113:
    image: r2dbc-dns-leak-repro:1.1.3
    build:
      context: .
      args:
        DRIVER_VERSION: 1.1.3.RELEASE
    depends_on:
      endpoint:
        condition: service_healthy
    mem_limit: 256m
    cpus: 1.0
